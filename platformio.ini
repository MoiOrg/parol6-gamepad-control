; Petit firmware de test cablage PAROL6 (1 moteur + lecture butees).
; Ouvre ce dossier dans VS Code / PlatformIO, puis Upload (ST-Link).
;
; Apres les tests, reflash le firmware PRINCIPAL :
;   PAROL6 control board main software

[env:genericSTM32F446RE]
platform = ststm32
platform_packages =
    framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32.git#2.7.1
board = genericSTM32F446RE
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
lib_extra_dirs =
    ../PAROL6 control board test code/lib
build_flags =
   -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
   -D USBCON
   -D USBD_VID=0x0483
   -D USBD_PID=0x5740
   -D USB_MANUFACTURER="Unknown"
